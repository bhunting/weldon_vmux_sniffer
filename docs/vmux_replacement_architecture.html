<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-MUX Replacement Architecture</title>
<style>
  body { margin: 0; padding: 16px; background: transparent; font-family: "Anthropic Sans", sans-serif; }
  svg { display: block; width: 100%; }
</style>
</head>
<body>
<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
  .t  { font-family: "Anthropic Sans", sans-serif; font-size: 14px; font-weight: 400; fill: var(--color-text-primary, #111); }
  .ts { font-family: "Anthropic Sans", sans-serif; font-size: 12px; font-weight: 400; fill: var(--color-text-secondary, #555); }
  .th { font-family: "Anthropic Sans", sans-serif; font-size: 14px; font-weight: 500; fill: var(--color-text-primary, #111); }
  .arr { fill: none; stroke: var(--color-border-secondary, #aaa); stroke-width: 1.2; }

  /* c-gray */
  .c-gray rect, .c-gray circle { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #444441; }
  .c-gray .ts { fill: #5F5E5A; }
  /* c-teal */
  .c-teal rect, .c-teal circle { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; }
  .c-teal .ts { fill: #0F6E56; }
  /* c-purple */
  .c-purple rect, .c-purple circle { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th { fill: #3C3489; }
  .c-purple .ts { fill: #534AB7; }
  /* c-coral */
  .c-coral rect, .c-coral circle { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th { fill: #712B13; }
  .c-coral .ts { fill: #993C1D; }

  @media (prefers-color-scheme: dark) {
    .c-gray rect, .c-gray circle { fill: #444441; stroke: #B4B2A9; }
    .c-gray .th { fill: #D3D1C7; }
    .c-gray .ts { fill: #B4B2A9; }
    .c-teal rect, .c-teal circle { fill: #085041; stroke: #5DCAA5; }
    .c-teal .th { fill: #9FE1CB; }
    .c-teal .ts { fill: #5DCAA5; }
    .c-purple rect, .c-purple circle { fill: #3C3489; stroke: #AFA9EC; }
    .c-purple .th { fill: #CECBF6; }
    .c-purple .ts { fill: #AFA9EC; }
    .c-coral rect, .c-coral circle { fill: #712B13; stroke: #F0997B; }
    .c-coral .th { fill: #F5C4B3; }
    .c-coral .ts { fill: #F0997B; }
    .arr { stroke: #555; }
  }
</style>

<!-- Phase labels -->
<text class="ts" x="40" y="30" font-weight="500">Phase 1 — Bus analysis</text>
<text class="ts" x="260" y="30" font-weight="500">Phase 2 — Hardware</text>
<text class="ts" x="460" y="30" font-weight="500">Phase 3 — Software</text>

<!-- PHASE 1: Bus Analysis -->
<g class="c-gray">
  <rect x="30" y="44" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="130" y="62" text-anchor="middle" dominant-baseline="central">Existing V-MUX bus</text>
  <text class="ts" x="130" y="78" text-anchor="middle" dominant-baseline="central">RS-485 twisted pair</text>
</g>
<g class="c-teal">
  <rect x="30" y="122" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="130" y="140" text-anchor="middle" dominant-baseline="central">USB-RS485 adapter</text>
  <text class="ts" x="130" y="156" text-anchor="middle" dominant-baseline="central">Passive tap, listen only</text>
</g>
<g class="c-teal">
  <rect x="30" y="200" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="130" y="218" text-anchor="middle" dominant-baseline="central">Logic analyzer</text>
  <text class="ts" x="130" y="234" text-anchor="middle" dominant-baseline="central">Confirm baud / framing</text>
</g>
<g class="c-teal">
  <rect x="30" y="278" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="130" y="296" text-anchor="middle" dominant-baseline="central">Message map</text>
  <text class="ts" x="130" y="312" text-anchor="middle" dominant-baseline="central">Code → function table</text>
</g>
<line x1="130" y1="88" x2="130" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="166" x2="130" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="130" y1="244" x2="130" y2="278" class="arr" marker-end="url(#arrow)"/>

<!-- PHASE 2: Hardware -->
<g class="c-gray">
  <rect x="250" y="44" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="345" y="62" text-anchor="middle" dominant-baseline="central">Interface board</text>
  <text class="ts" x="345" y="78" text-anchor="middle" dominant-baseline="central">MCU + RS-485 transceiver</text>
</g>
<g class="c-purple">
  <rect x="250" y="122" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="345" y="140" text-anchor="middle" dominant-baseline="central">RS-485 tap circuit</text>
  <text class="ts" x="345" y="156" text-anchor="middle" dominant-baseline="central">Isolated, no termination</text>
</g>
<g class="c-purple">
  <rect x="250" y="200" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="345" y="218" text-anchor="middle" dominant-baseline="central">Power supply</text>
  <text class="ts" x="345" y="234" text-anchor="middle" dominant-baseline="central">12V filtered + protected</text>
</g>
<g class="c-purple">
  <rect x="250" y="278" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="345" y="296" text-anchor="middle" dominant-baseline="central">Switch panel I/O</text>
  <text class="ts" x="345" y="312" text-anchor="middle" dominant-baseline="central">Physical controls + LEDs</text>
</g>
<g class="c-purple">
  <rect x="250" y="356" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="345" y="374" text-anchor="middle" dominant-baseline="central">Touchscreen</text>
  <text class="ts" x="345" y="390" text-anchor="middle" dominant-baseline="central">SPI/LVDS display</text>
</g>
<line x1="345" y1="88" x2="345" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="345" y1="166" x2="345" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="345" y1="244" x2="345" y2="278" class="arr" marker-end="url(#arrow)"/>
<line x1="345" y1="322" x2="345" y2="356" class="arr" marker-end="url(#arrow)"/>

<!-- PHASE 3: Software -->
<g class="c-gray">
  <rect x="460" y="44" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="62" text-anchor="middle" dominant-baseline="central">Bus driver layer</text>
  <text class="ts" x="555" y="78" text-anchor="middle" dominant-baseline="central">TX / RX message codec</text>
</g>
<g class="c-coral">
  <rect x="460" y="122" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="140" text-anchor="middle" dominant-baseline="central">Macro engine</text>
  <text class="ts" x="555" y="156" text-anchor="middle" dominant-baseline="central">Sequenced multi-message</text>
</g>
<g class="c-coral">
  <rect x="460" y="200" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="218" text-anchor="middle" dominant-baseline="central">Config store</text>
  <text class="ts" x="555" y="234" text-anchor="middle" dominant-baseline="central">Flash / SD user layout</text>
</g>
<g class="c-coral">
  <rect x="460" y="278" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="296" text-anchor="middle" dominant-baseline="central">HMI renderer</text>
  <text class="ts" x="555" y="312" text-anchor="middle" dominant-baseline="central">LVGL touch + switch UI</text>
</g>
<g class="c-coral">
  <rect x="460" y="356" width="190" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="555" y="374" text-anchor="middle" dominant-baseline="central">State monitor</text>
  <text class="ts" x="555" y="390" text-anchor="middle" dominant-baseline="central">SYNC watchdog + alerts</text>
</g>
<line x1="555" y1="88" x2="555" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="166" x2="555" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="244" x2="555" y2="278" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="322" x2="555" y2="356" class="arr" marker-end="url(#arrow)"/>

<!-- Cross-phase arrows -->
<line x1="230" y1="300" x2="250" y2="300" class="arr" marker-end="url(#arrow)" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="440" y1="300" x2="460" y2="300" class="arr" marker-end="url(#arrow)" stroke="#534AB7" stroke-width="1.5"/>

<!-- Bottom outcome -->
<g class="c-teal">
  <rect x="30" y="490" width="620" height="48" rx="10" stroke-width="0.5"/>
  <text class="th" x="340" y="510" text-anchor="middle" dominant-baseline="central">Replacement controller: reconfigurable HMI + macro engine + full V-MUX bus control</text>
  <text class="ts" x="340" y="528" text-anchor="middle" dominant-baseline="central">Sits as node on existing bus — existing field wiring unchanged</text>
</g>

<!-- Converging lines to outcome -->
<line x1="130" y1="322" x2="130" y2="470" stroke="#aaa" stroke-width="0.5"/>
<line x1="345" y1="400" x2="345" y2="470" stroke="#aaa" stroke-width="0.5"/>
<line x1="555" y1="400" x2="555" y2="470" stroke="#aaa" stroke-width="0.5"/>
<line x1="130" y1="470" x2="555" y2="470" stroke="#aaa" stroke-width="0.5"/>
<line x1="340" y1="470" x2="340" y2="490" class="arr" marker-end="url(#arrow)"/>
</svg>
</body>
</html>
